name: DB Backup
on:
  schedule:
    # 01:00 UTC = 03:00 Europe/Warsaw in summer, 02:00 in winter (salon closed)
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?secret DATABASE_URL missing}"
          : "${BACKUP_PASSWORD:?secret BACKUP_PASSWORD missing}"
          umask 077
          name="pos-app_$(date -u +%F_%H%M%S).dump.gpg"
          # pg_dump from Docker: its major version must be >= the Supabase server major.
          docker run --rm -e DATABASE_URL postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --schema=public --no-owner --no-privileges' \
            > backup.dump
          # Repo is public, so artifacts are downloadable by anyone: encrypt before upload.
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --output "$name" backup.dump 3<<<"$BACKUP_PASSWORD"
          rm backup.dump
          test -s "$name"
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"
          ls -la "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          compression-level: 0
